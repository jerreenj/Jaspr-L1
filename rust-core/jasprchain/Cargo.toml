[package]
name = "jasprchain"
version = "0.1.0"
edition = "2021"
authors = ["Jaspr Labs"]
description = "High-performance Layer 1 blockchain"
license = "MIT"
repository = "https://github.com/jasprlabs/jasprchain"

[dependencies]
# Cryptography
blst = "0.3"                        # BLS12-381 signatures
ed25519-dalek = "2.0"               # Ed25519 signatures
sha2 = "0.10"                       # SHA-256/512 hashing
blake3 = "1.5"                      # Fast hashing
rand = "0.8"                        # Random number generation
hex = "0.4"                         # Hex encoding
base64 = "0.21"                     # Base64 encoding

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking
libp2p = { version = "0.53", features = ["tokio", "noise", "tcp", "quic", "dns", "identify", "gossipsub"] }
quinn = "0.10"                      # QUIC transport

# Storage
rocksdb = "0.21"                    # Persistent storage

# Move VM (optional)
move-vm-runtime = { version = "0.1", optional = true }
move-core-types = { version = "0.1", optional = true }
move-binary-format = { version = "0.1", optional = true }

# Utilities
thiserror = "1.0"                   # Error handling
tracing = "0.1"                     # Logging
tracing-subscriber = "0.3"          # Log subscriber
clap = { version = "4.4", features = ["derive"] }  # CLI
toml = "0.8"                        # Config parsing
chrono = "0.4"                      # Time handling
uuid = { version = "1.6", features = ["v4"] }
parkingـlot = "0.12"                # Better mutexes

[features]
default = []
move-vm = ["move-vm-runtime", "move-core-types", "move-binary-format"]

[[bin]]
name = "jasprchain"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
